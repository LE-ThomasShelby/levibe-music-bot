services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: levibe-lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx512M
    volumes:
      - ./application.example.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "2333:2333"

  bot:
    build: .
    container_name: levibe-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      LAVALINK_SECURE: "false"
    depends_on:
      - lavalink
